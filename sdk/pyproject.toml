[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freesdn-sdk"
version = "0.2.0"
description = "Plugin SDK for building FreeSDN plugins - base classes, testing utilities, and CLI tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PyPV - Python Platform Ventures", email = "contact@freesdn.org" },
]
keywords = ["freesdn", "plugin", "sdk", "network", "sdn", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # Security floors: pydantic>=2.4 closes CVE-2024-3772 (ReDoS); fastapi>=0.109.1
    # closes CVE-2024-24762 (Content-Type ReDoS). Floors only — consumers still
    # resolve the latest; this just prevents resolving a known-vulnerable old pin.
    "pydantic>=2.4",
    "fastapi>=0.109.1",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
]

[project.scripts]
freesdn-sdk = "freesdn_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/freesdn/freesdn-sdk"
Documentation = "https://docs.freesdn.org/plugins/"
Repository = "https://github.com/freesdn/freesdn-sdk"
Issues = "https://github.com/freesdn/freesdn-sdk/issues"
Changelog = "https://github.com/freesdn/freesdn-sdk/blob/main/sdk/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/freesdn_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/freesdn_sdk", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
