[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freesdn"
version = "0.3.0"
description = "Convenience wrapper that re-exports the FreeSDN plugin SDK (freesdn-sdk) under the shorter `freesdn` import path."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "FreeSDN", email = "contact@freesdn.org" },
]
keywords = ["freesdn", "sdn", "plugin", "sdk", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = [
    # Not >=0.1.0: this package re-exports PluginCoordinator and
    # PluginNotReady, which 0.1.0 does not have, so an older SDK makes
    # `import freesdn` raise ImportError at the first line.
    "freesdn-sdk>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/freesdn/freesdn"
Documentation = "https://docs.freesdn.org"
Repository = "https://github.com/freesdn/freesdn"
Issues = "https://github.com/freesdn/freesdn/issues"

[project.optional-dependencies]
# The wrapper has no runtime dev needs of its own; these exist so its parity
# tests can run in CI, which it did not have.
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "build>=1.6.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The whole purpose of this module is to import names and re-export them; every
# one is "unused" where it is bound and used by whoever imports `freesdn`.
# __all__ is what makes them public, and a test asserts it matches the SDK.
"src/freesdn/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/freesdn"]
